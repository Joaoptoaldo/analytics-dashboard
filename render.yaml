services:
  - type: web
    name: dashboard-backend
    env: docker
    docker:
      dockerfilePath: Dockerfile
    plan: starter
    instanceCount: 1
    healthCheckPath: /readiness
    envVars:
      - key: ENV
        value: production
      - key: ALLOW_SEED
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "5"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: CORS_ORIGINS
        fromSecret: CORS_ORIGINS
      - key: EXTERNAL_SYNC_TOKEN
        fromSecret: EXTERNAL_SYNC_TOKEN
      - key: VITE_API_BASE_URL
        fromSecret: VITE_API_BASE_URL

# Notes:
# - Set secrets in Render dashboard or via `render secrets set DATABASE_URL "..."` before deploy.
# - This file allows Render to auto-create the service via the dashboard or CLI.
