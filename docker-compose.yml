version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - PORT=8080
    volumes:
      - ./backend:/app/backend:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
