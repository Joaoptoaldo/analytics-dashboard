services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-development}
      PORT: 8080
      WEB_CONCURRENCY: 1
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173,http://127.0.0.1:4173}
      EXTERNAL_SYNC_TOKEN: ${EXTERNAL_SYNC_TOKEN:-}
      ALLOW_SEED: "false"
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 2
      DB_CONNECT_TIMEOUT_SECONDS: 5
      DB_STATEMENT_TIMEOUT_MS: 5000
      DB_POOL_TIMEOUT_SECONDS: 30
      DB_POOL_RECYCLE_SECONDS: 1800
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8080/api}
        VITE_USE_EXTERNAL: ${VITE_USE_EXTERNAL:-true}
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - frontend
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4173/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s