name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  frontend:
    name: Frontend Lint Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build

  backend:
    name: Backend Smoke and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Backend tests
        env:
          ENV: test
          DATABASE_URL: sqlite:///./backend.db
          CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
          EXTERNAL_SYNC_TOKEN: "test-token-at-least-32-characters-long!!"
        run: |
          python -m pytest backend/tests -q

      - name: Backend smoke import
        env:
          ENV: test
          DATABASE_URL: sqlite:///./backend.db
          CORS_ORIGINS: "http://localhost:3000,http://localhost:8000"
          EXTERNAL_SYNC_TOKEN: "test-token-at-least-32-characters-long!!"
        run: |
          python -c "from backend.main import app; print(app.title)"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Security audit
        run: python -m pip_audit -r backend/requirements.txt